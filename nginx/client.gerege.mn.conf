# client.gerege.mn — Gerege Client.
#
# Upstream портууд нь ЦӨМИЙН АНХДАГЧ БИШ: 3017 бүрхүүл, 8097 API. Энэ стек
# nexus.gerege.mn-тэй ижил машин дээр сууж байгаа бөгөөд тэр нь 3008/8082-ыг
# аль хэдийн эзэлсэн. deploy/docker-compose.yml-ийн published портууд болон
# энэ файл хамт өөрчлөгдөнө.
#
# Энэ vhost цөмийн `snippets/nexus-oauth.conf`-ыг include ХИЙХГҮЙ. Тэр snippet
# 127.0.0.1:8082 гэж хатуу бичсэн байдаг — энэ хост дээр тэр бол цөмийн өөрийнх
# нь backend. Include хийсэн бол client.gerege.mn нь nexus.gerege.mn-ий
# discovery баримтыг өөрийн домэйноор тарааж, «клиент» нь өөрөө провайдер мэт
# харагдах байсан. Тиймээс OIDC замуудыг доор өөрөө бичив.
#
# server_name нь яг нэг хост: энэ IP дээр өөр олон домэйн сууж байгаа тул
# default_server ч, wildcard ч биш байх нь заавал.
#
# Энэ файлыг certbot-оос ӨМНӨ суулгана. Certbot үүнийг өөрөө засаж `listen 443
# ssl` мөрүүд, 80 → https чиглүүлэгч блокийг нэмнэ.
limit_req_zone $binary_remote_addr zone=client_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=client_oauth:10m rate=30r/m;

server {
    listen 80;
    server_name client.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # API нь эдгээрийг өөрийн хариудаа тавьдаг, бүрхүүлийн upstream нэгийг
        # нь ч тавьдаггүй. server түвшинд биш яг энд байгаа нь: nginx тэгвэл
        # API-гийн өөрийнх дээр хоёр дахь хуулбарыг нэмнэ, давхардсан
        # X-Frame-Options-ыг зарим хөтөч бүхэлд нь хаядаг.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Байрлуулалтын өөрийн лого, icon: /opt/client-nexus/brand/ доторх файлууд.
    # Хоосон бол энэ хэсэг 404 хариулж, бүрхүүл образынхаа зургийг үзүүлнэ.
    location /brand/ {
        alias /opt/client-nexus/brand/;
        access_log off;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8097/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь 25 секунд онгорхой байдаг long poll. Анхдагч 60s
        # багтаах ч хэн нэгэн сохроор чангалахгүйн тулд бичив.
        proxy_read_timeout 90s;
    }

    # Урилгын холбоос: гадны хүн ТОКЕНоор ордог хаалга — /api/-ийн гадна
    # амьдардаг (modules/documents/invite.go). Энэ location-гүйгээр урилгын
    # имэйл дэх холбоос бүрхүүлийн 404 руу очно.
    location /contract/ {
        proxy_pass http://127.0.0.1:8097/contract/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хязгаарлалт нь орох цэг дээрээ. Энэ суулгац дээр нууц үгийн нэвтрэлт
    # унтраалттай ч (SSO_CLIENT_LOCAL_LOGIN=false) провайдер унасан үед буцаж
    # асдаг тул зам нь хамгаалалттай хэвээр байх ёстой.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=client_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- OIDC
    # Цөмийн snippet-ийн агуулга, зөвхөн энэ стекийн порт руу. Энэ суулгац
    # nexus.gerege.mn-ий клиент боловч өөрийн дээрээ суусан аппуудад identity
    # тарааж өгсөн хэвээр — цөмийн docs/SSO_FEDERATION.md-ийн гурав дахь мөр.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Яг таарах нь дээрх угтварыг дийлнэ гэдгийг nginx баталгаажуулдаг тул
    # токен солилцоо өөрийн хязгаарлалттай хэвээр.
    location = /oauth2/token {
        limit_req zone=client_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/appstore-keys.json {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/urtuu.json {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
